name: ci

# Linux-only matrix on purpose: GitHub-hosted macOS runners are
# billed at 10× Linux. There's no native code or platform-specific
# behavior in this repo, so Linux coverage is sufficient.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint + test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (with all provider extras for full import coverage)
        run: |
          python -m pip install --upgrade pip
          # `[all]` pulls every provider SDK so adapter modules can
          # be imported during collection. `[dev]` adds the test +
          # lint toolchain.
          pip install -e ".[dev,all]"
          pip install bandit pip-audit

      - name: Ruff (lint)
        # Ruff is the source of truth for style + most static
        # checks. Adds zero false-positives on this codebase.
        run: ruff check ai_assistant_client tests

      - name: Bandit (medium+ severity, no findings allowed)
        # `-ll` requires medium-or-higher severity to fail; low
        # severity is informational. `-r` walks the package
        # recursively. Tests are excluded — assert + temp-file
        # patterns produce noise without security signal.
        run: bandit -r ai_assistant_client -ll

      - name: pip-audit (Python deps)
        # Fails on any unsuppressed advisory in the resolved
        # dependency tree. `--skip-editable` excludes the in-tree
        # `ai-assistant-client` install (pip-audit can't look up
        # an editable local install on PyPI).
        run: pip-audit --skip-editable

      - name: pytest (with branch coverage gate ≥90%)
        run: pytest -q --cov=ai_assistant_client --cov-branch --cov-report=term-missing --cov-fail-under=90

  trivy:
    name: trivy (filesystem + Dockerfile)
    runs-on: ubuntu-latest
    # Independent of the Python matrix — runs once per push/PR.
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        # Catches CVEs in OS packages declared in the repo + any
        # known-vulnerable lockfile entries. SARIF output is
        # uploaded to the security tab when the workflow has
        # `security-events: write` (added at the workflow level
        # below for the SARIF-uploading jobs).
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy Dockerfile scan
        # Lints the Dockerfile for misconfig (root user, missing
        # HEALTHCHECK, etc.) before any image is even built.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

  docker-build:
    name: docker build (sanity)
    runs-on: ubuntu-latest
    # Builds the image but doesn't push — just confirms the
    # Dockerfile still resolves and the layer graph is sane.
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-assistant-client:ci .
