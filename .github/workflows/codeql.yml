name: codeql

# GitHub-native SAST. Free for public repos; included on most
# private-repo plans. Runs on push to main, on PRs, and weekly
# to catch new query-pack rules against unchanged code.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Mondays 06:00 UTC — outside US-business-hours so it doesn't
    # compete with PR runs for runner capacity.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  # Required for CodeQL to upload its SARIF result to the
  # repo's Security tab.
  security-events: write
  # Required for private-repo Code Scanning.
  actions: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # `security-extended` adds higher-signal queries beyond
          # the default set. `security-and-quality` would also add
          # maintainability rules — out of scope for a security
          # scan, so we stop at `security-extended`.
          queries: security-extended

      - name: Autobuild
        # Pure-Python — autobuild is a no-op but kept here so the
        # workflow doesn't need editing if a compiled extension
        # is added later.
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
