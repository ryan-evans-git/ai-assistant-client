[project]
name = "ai-assistant-client"
version = "0.1.0"
description = "Provider-agnostic streaming chat client with MCP tool support and progressive tool discovery. Switch between Anthropic Claude, OpenAI, Google Gemini, and AWS Bedrock with a single env var."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "ryan-evans-git" },
]
keywords = ["llm", "claude", "anthropic", "openai", "gemini", "bedrock", "mcp", "chat", "sse", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "rapidfuzz>=3.6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.40.0"]
gemini = ["google-genai>=0.3.0"]
bedrock = ["boto3>=1.34.0"]
all = [
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "google-genai>=0.3.0",
    "boto3>=1.34.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "respx>=0.21.0",
]

[project.scripts]
ai-assistant-client = "ai_assistant_client.app:main"

[project.urls]
Homepage = "https://github.com/ryan-evans-git/ai-assistant-client"
Repository = "https://github.com/ryan-evans-git/ai-assistant-client"

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_assistant_client*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ai_assistant_client"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
fail_under = 90
show_missing = true
skip_covered = false
