[project]
name = "ai-assistant-client"
version = "0.1.0"
description = "Streaming chat client for Claude with MCP tool support and progressive tool discovery."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "ryan-evans-git" },
]
keywords = ["claude", "anthropic", "mcp", "chat", "sse", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "anthropic>=0.40.0",
    "mcp>=1.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "rapidfuzz>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "respx>=0.21.0",
]

[project.scripts]
ai-assistant-client = "ai_assistant_client.app:main"

[project.urls]
Homepage = "https://github.com/ryan-evans-git/ai-assistant-client"
Repository = "https://github.com/ryan-evans-git/ai-assistant-client"

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_assistant_client*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
